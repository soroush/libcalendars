name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Configure
        # Built with debug flags, because the tests report failures through
        # assert and NDEBUG would disable it. The git hooks are for a working
        # checkout and have no place on a runner, so they are turned off.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DLIBCALENDARS_GIT_HOOKS=OFF

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  package:
    name: debian package
    # Only worth building packages once the library and the tests are known
    # good on both runners.
    needs: build
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install the build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends             build-essential debhelper cmake devscripts lintian fakeroot git ca-certificates

      - name: Check out the source
        uses: actions/checkout@v7

      - name: Allow git to read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the packages
        run: dpkg-buildpackage -us -uc -b

      - name: Check the packages with lintian
        run: lintian --tag-display-limit 0 ../libcalendars_*_*.changes

      - name: Collect the packages
        # dpkg-buildpackage writes to the parent directory, which is outside
        # the workspace, and upload-artifact refuses a path containing "..".
        run: |
          mkdir -p packages
          mv ../*.deb ../*.buildinfo ../*.changes packages/
          ls -l packages

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: packages/
          if-no-files-found: error

  rpm:
    name: rpm package
    # Same gate as the Debian stage: only package what already builds and
    # tests cleanly.
    needs: build
    runs-on: ubuntu-latest
    container: quay.io/rockylinux/rockylinux:10

    steps:
      - name: Install the build dependencies
        run: |
          dnf -y install rpm-build rpmdevtools cmake gcc make git epel-release
          dnf -y install rpmlint

      - name: Check out the source
        uses: actions/checkout@v7

      - name: Allow git to read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the packages
        # The version comes from the spec so the two cannot drift apart, and
        # the tree location from rpm itself rather than from an assumption
        # about where the home directory is.
        run: |
          set -x
          # --srpm, because a plain query prints the version once per binary
          # package and they run together with no separator.
          version=$(rpmspec -q --srpm --queryformat '%{version}' rpm/libcalendars.spec)
          topdir=$(rpm --eval '%{_topdir}')
          rpmdev-setuptree
          mkdir -p "$topdir/SOURCES"
          tarball="$topdir/SOURCES/libcalendars-${version}.tar.gz"
          git archive --format=tar.gz --prefix="libcalendars-${version}/" -o "$tarball" HEAD
          ls -l "$topdir/SOURCES"
          rpmbuild -ba rpm/libcalendars.spec

      - name: Check the packages with rpmlint
        run: |
          topdir=$(rpm --eval '%{_topdir}')
          rpmlint "$topdir"/RPMS/*/*.rpm "$topdir"/SRPMS/*.rpm

      - name: Collect the packages
        run: |
          topdir=$(rpm --eval '%{_topdir}')
          mkdir -p packages
          cp "$topdir"/RPMS/*/*.rpm "$topdir"/SRPMS/*.rpm packages/
          ls -l packages

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: rpm-packages
          path: packages/
          if-no-files-found: error

  windows:
    name: windows package
    # Same gate as the Debian and RPM stages.
    needs: build
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Configure
        # The Visual Studio generator is multi-config, so one configure serves
        # both the Debug and the Release build below.
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=OFF
          -DLIBCALENDARS_GIT_HOOKS=OFF

      - name: Read the version
        # The zip files carry the version in their name. It is taken from the
        # CMake cache, where project() records it, so that it cannot drift
        # from the one the library is built with.
        run: |
          $version = (Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Debug
        run: cmake --build build --config Debug

      - name: Build Release
        run: cmake --build build --config Release

      - name: Install Debug
        run: cmake --install build --config Debug --prefix packages/libcalendars-${{ env.VERSION }}-win64-Debug

      - name: Install Release
        run: cmake --install build --config Release --prefix packages/libcalendars-${{ env.VERSION }}-win64-Release

      - name: Zip the packages
        # A package is the install tree as is, zipped with the directory as
        # its top level. cmake -E tar is used so that the archive is written
        # by a tool that is already present, with forward slashes in the
        # entry names.
        working-directory: packages
        run: |
          cmake -E tar cf libcalendars-${{ env.VERSION }}-win64-Debug.zip --format=zip libcalendars-${{ env.VERSION }}-win64-Debug
          cmake -E tar cf libcalendars-${{ env.VERSION }}-win64-Release.zip --format=zip libcalendars-${{ env.VERSION }}-win64-Release
          Get-ChildItem *.zip

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: packages/*.zip
          if-no-files-found: error
