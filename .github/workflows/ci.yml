name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Configure
        # Built with debug flags, because the tests report failures through
        # assert and NDEBUG would disable it. The git hooks are for a working
        # checkout and have no place on a runner, so they are turned off.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DLIBCALENDARS_GIT_HOOKS=OFF

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  package:
    name: debian package
    # Only worth building packages once the library and the tests are known
    # good on both runners.
    needs: build
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install the build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends             build-essential debhelper cmake devscripts lintian fakeroot git ca-certificates

      - name: Check out the source
        uses: actions/checkout@v5

      - name: Allow git to read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the packages
        run: dpkg-buildpackage -us -uc -b

      - name: Check the packages with lintian
        run: lintian --tag-display-limit 0 ../libcalendars_*_*.changes

      - name: Collect the packages
        # dpkg-buildpackage writes to the parent directory, which is outside
        # the workspace, and upload-artifact refuses a path containing "..".
        run: |
          mkdir -p packages
          mv ../*.deb ../*.buildinfo ../*.changes packages/
          ls -l packages

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: packages/
          if-no-files-found: error
