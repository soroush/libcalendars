name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Configure
        # Built with debug flags, because the tests report failures through
        # assert and NDEBUG would disable it. The git hooks are for a working
        # checkout and have no place on a runner, so they are turned off.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DLIBCALENDARS_GIT_HOOKS=OFF

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
