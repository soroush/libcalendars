name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Configure
        # The git hooks are for a working checkout and have no place on a
        # runner, so they are turned off here.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DLIBCALENDARS_GIT_HOOKS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        # The tests report failures through assert, which NDEBUG disables, so
        # only the Debug matrix entries can actually fail. The Release entries
        # are here to prove the library and the tests still compile with
        # optimisation on.
        run: ctest --test-dir build --config ${{ matrix.build_type }} --output-on-failure
